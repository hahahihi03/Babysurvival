<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#1b2337"><title>육아 서바이벌</title><style>
*{box-sizing:border-box}body{margin:0;background:#171f32;color:#fff5e4;font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif}main{max-width:650px;margin:auto;padding:12px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:19px;margin:6px 0}.pill{background:#34425e;border-radius:7px;padding:7px 10px;font-weight:800;font-size:13px}#meters{display:grid;gap:7px;margin:12px 0}.meter{display:grid;grid-template-columns:94px 1fr 34px;gap:8px;align-items:center;font-size:12px}.track{height:14px;background:#46506b;border:2px solid #0d1424}.fill{height:100%;width:100%;background:#f07d82}.meter:nth-child(2) .fill{background:#8cbcf5}.meter:nth-child(3) .fill{background:#f3c775}.danger .fill{animation:blink .45s infinite alternate}@keyframes blink{to{opacity:.3}}canvas{display:block;width:100%;aspect-ratio:240/180;image-rendering:pixelated;touch-action:manipulation;border:4px solid #596580;border-radius:5px;background:#e8c9aa}#controls{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:12px 13px;background:#f4c66e;color:#263048;font-weight:800}button.secondary{background:#3c4d70;color:white}button:disabled{opacity:.5}#symbols{min-height:26px;font-size:13px;margin:8px 0;color:#f9da93}#hint{font-size:12px;line-height:1.6;color:#bbc9de;margin:10px 0}#ranking{background:#242f47;border-radius:8px;margin-top:16px;padding:13px}#ranking h2{font-size:16px;margin:0 0 8px}#rankNote{font-size:12px;color:#bbc9de}#rankList{font-size:13px;line-height:1.9;padding-left:23px}#modal{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:15px;background:#11182cdb}#modal.hidden{display:none}.panel{width:min(100%,430px);background:#fff3db;color:#27334a;border:4px solid #7e5c61;box-shadow:7px 7px #121a2c;padding:17px;text-align:center}.panel h2{margin:4px 0 12px;font-size:23px}.panel p{line-height:1.5}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.options button{min-height:72px;line-height:1.5;background:#dceaf9;border:2px solid #8caccd}.options button:nth-child(2){background:#f9dcd6;border-color:#d99d9a}.options button:nth-child(3){background:#e8dff7;border-color:#b4a1d1}.options button:nth-child(4){background:#ffebbd;border-color:#e0ba69}.panel input{width:100%;padding:10px;border:2px solid #8caccd;margin:8px 0;border-radius:6px;font:inherit}.minor{font-size:12px;color:#59657a}footer{font-size:11px;color:#9caec8;margin:16px 0}
</style></head><body><main><header><h1>🍼 육아 서바이벌</h1><div class="pill" id="clock">DAY 1 · 07:00</div></header><section id="meters"><div class="meter" id="eRow"><span>❤️ 보호자 체력</span><div class="track"><div class="fill" id="eFill"></div></div><b id="eNum">100</b></div><div class="meter" id="mRow"><span>🧠 정신력</span><div class="track"><div class="fill" id="mFill"></div></div><b id="mNum">100</b></div><div class="meter" id="bRow"><span>👶 아기 안정도</span><div class="track"><div class="fill" id="bFill"></div></div><b id="bNum">100</b></div></section><canvas id="game" width="240" height="180" aria-label="아기방 게임 화면. 아기를 터치해 돌봄 선택지를 여세요."></canvas><div id="symbols" aria-live="polite"></div><div id="controls"><button class="secondary" id="pause">⏸ 일시정지</button><button class="secondary" id="sound">🔇 효과음</button><button class="secondary" id="refresh">🏆 랭킹 갱신</button></div><p id="hint">아기에게 <b>!</b>가 뜨면 아기를 터치해 필요한 돌봄을 골라주세요. 정답은 울음을 멈추고, 오답은 정신력을 소모해요. 보호자 상황은 선택 이벤트로 등장해요.</p><section id="ranking"><h2>🏆 전체 플레이어 랭킹</h2><div id="rankNote">연결 상태 확인 중…</div><ol id="rankList"></ol></section><footer>DAY 1 = 실제 90초 · 모바일 터치 지원 · GitHub Pages에서 실행 가능</footer></main><div id="modal"><div class="panel" id="panel"></div></div><script src="config.js"></script><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),cv=$('game'),cx=cv.getContext('2d');cx.imageSmoothingEnabled=false;
const cfg=window.BABY_SURVIVAL_CONFIG||{},base=(cfg.supabaseUrl||'').replace(/\/$/,''),apiKey=cfg.supabaseAnonKey||'',online=!!(base&&apiKey);
const kinds=[{id:'diaper',label:'기저귀 갈기',icon:'🧷'},{id:'milk',label:'분유 주기',icon:'🍼'},{id:'sleep',label:'재우기',icon:'🌙'},{id:'play',label:'놀아주기',icon:'🧸'}];
let g=null,frameId=0,last=0,sound=false,audio=null;
const clamp=n=>Math.max(0,Math.min(100,n)),rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
function modal(html){$('panel').innerHTML=html;$('modal').classList.remove('hidden')}
function close(){ $('modal').classList.add('hidden');last=performance.now() }
function beep(hz=480,d=.09){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),v=audio.createGain();o.type='square';o.frequency.value=hz;v.gain.value=.03;o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}
function start(){g={sec:0,energy:100,mind:100,baby:100,stress:0,cry:null,cryTime:0,care:0,nextCry:5,nextRandom:19,napUntil:0,paused:false,run:true,day:1,flash:'',flashUntil:0,extra:'',extraUntil:0,cryCause:'',cryMultiplier:1,bellyUntil:0,teethUntil:0};close();$('pause').textContent='⏸ 일시정지';last=performance.now();cancelAnimationFrame(frameId);frameId=requestAnimationFrame(loop)}
function day(){return Math.floor(g.sec/90)+1}
function time(){const minute=Math.floor((420+g.sec*16)%1440);return String(Math.floor(minute/60)).padStart(2,'0')+':'+String(minute%60).padStart(2,'0')}
function night(){const h=Number(time().slice(0,2));return h>=21||h<6}
function cryInterval(){const d=day();let a=d<3?[9,13]:d<6?[7,10]:[5.5,8];if(g.sec<g.bellyUntil)a=[3.5,5.5];if(g.sec<g.teethUntil)a=[3,5];return rnd(...a)}
function beginCry(){if(g.cry||g.sec<g.napUntil)return;g.cry=pick(kinds).id;g.cryTime=0;g.cryCause=g.sec<g.bellyUntil?'배앓이':g.sec<g.teethUntil?'이앓이':'';g.flash='!';g.flashUntil=g.sec+1;beep(290,.13)}
function flash(s,secs=1.4){g.flash=s;g.flashUntil=g.sec+secs}
function selectCare(){if(!g||!g.run||g.paused||!g.cry)return;const options=kinds.map(k=>`<button data-care="${k.id}"><span style="font-size:22px">${k.icon}</span><br>${k.label}</button>`).join('');modal(`<h2>👶 아기 돌보기</h2><p class="minor">어떤 도움이 필요할까요?</p><div class="options">${options}</div><p class="minor">틀리면 정신력 -8 · 다시 선택할 수 있어요</p>`);$('panel').querySelectorAll('[data-care]').forEach(b=>b.onclick=()=>care(b.dataset.care))}
function care(id){if(!g||!g.cry)return;if(id===g.cry){g.cry=null;g.cryTime=0;g.care++;g.baby=clamp(g.baby+22);g.energy=clamp(g.energy-5);g.mind=clamp(g.mind+2);g.nextCry=g.sec+cryInterval();close();flash('✓',1);beep(720,.13)}else{g.mind=clamp(g.mind-8);beep(160,.18);const el=$('panel').querySelector('.minor');if(el)el.textContent='❌ 다시 시도! 정신력 -8';if(g.mind<=0){close();gameOver()}}}
function randomEvent(){if(g.cry)return;const type=pick(['food','nap','food','nap']);if(type==='food'){modal(`<h2>🍚 배가 고픕니다</h2><p>식사를 하겠습니까?</p><div class="options"><button data-choice="order">🛵<br>시켜 먹는다</button><button data-choice="cook">🍳<br>만들어 먹는다</button><button data-choice="skip">❌<br>굶는다</button></div>`);const outcomes={order:[20,10,0],cook:[30,6,8],skip:[-12,-7,0]};$('panel').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const [en,mi,st]=outcomes[b.dataset.choice];g.energy=clamp(g.energy+en*(night()&&en>0?.8:1));g.mind=clamp(g.mind+mi*(night()&&mi>0?.8:1));g.stress=clamp(g.stress+st);close();flash('🍚');})}else{g.napUntil=g.sec+9;modal(`<h2>💤 아기가 잠들었습니다</h2><p>이 시간을 어떻게 보내겠습니까?</p><div class="options"><button data-choice="together">🛌<br>같이 잔다</button><button data-choice="house">🧹<br>집안일을 한다</button><button data-choice="phone">📱<br>핸드폰을 본다</button></div>`);$('panel').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let choice=b.dataset.choice;if(choice==='together'){g.energy=clamp(g.energy+28*(night()?.8:1));g.mind=clamp(g.mind+9*(night()?.8:1));g.stress=clamp(g.stress+15)}else if(choice==='house'){g.energy=clamp(g.energy-16);g.stress=clamp(g.stress-18);g.mind=clamp(g.mind+3)}else{g.energy=clamp(g.energy-10);g.mind=clamp(g.mind+19);g.stress=clamp(g.stress+3)}close();flash(choice==='together'?'💤':choice==='house'?'🧹':'📱')})}}
function randomModifiers(){if(day()>=3&&g.sec>=g.bellyUntil&&Math.random()<.5){g.bellyUntil=g.sec+22;g.extra='배앓이';g.extraUntil=g.bellyUntil;g.nextCry=Math.min(g.nextCry,g.sec+3);flash('⚡',2)}else if(day()>=5&&g.sec>=g.teethUntil){g.teethUntil=g.sec+26;g.extra='이앓이';g.extraUntil=g.teethUntil;g.nextCry=Math.min(g.nextCry,g.sec+3);flash('⚡',2)}}
function tick(dt){g.sec+=dt;const d=day();if(d!==g.day){g.day=d;flash('DAY '+d,2);beep(680,.2);if(d>=3)randomModifiers()}
if(g.sec>=g.nextCry){beginCry();g.nextCry=g.sec+cryInterval()}
if(g.sec>=g.nextRandom){g.nextRandom=g.sec+rnd(19,27);randomEvent()}
if(d>=3&&Math.random()<dt*.015&&g.sec>=g.bellyUntil&&g.sec>=g.teethUntil)randomModifiers();
g.energy-=.055*dt;g.mind-=(.06+g.stress*.002)*dt;g.baby-=.1*dt;
if(g.cry){g.cryTime+=dt;g.baby-=1.2*dt;const t=g.cryTime;g.mind-=(t<10?.2:t<20?.4:t<30?.7:1)*dt}
g.energy=clamp(g.energy);g.mind=clamp(g.mind);g.baby=clamp(g.baby);if(g.energy<=0||g.mind<=0||g.baby<=0)gameOver()}
function gameOver(){if(!g?.run)return;g.run=false;const reason=g.energy<=0?'체력 고갈':g.mind<=0?'정신력 고갈':'아기 안정도 고갈';const rec={nickname:localStorage.getItem('babySurvivalNick')||'익명',survived_seconds:Math.floor(g.sec),care_count:g.care};let best;try{best=JSON.parse(localStorage.getItem('babySurvivalBest')||'null')}catch{}if(!best||rec.survived_seconds>best.survived_seconds)localStorage.setItem('babySurvivalBest',JSON.stringify(rec));modal(`<h2>GAME OVER</h2><p>${reason}<br><b>DAY ${day()} · ${time()}</b><br>생존 ${duration(g.sec)} · 돌봄 성공 ${g.care}회</p><input id="nick" maxlength="12" placeholder="닉네임 (최대 12자)"><button id="save">${online?'온라인 랭킹 등록':'내 기록 저장'}</button><button id="again">다시 도전</button><p class="minor">${online?'온라인 랭킹에 점수를 등록할 수 있어요.':'온라인 랭킹은 config.js에서 Supabase 연결 후 활성화돼요.'}</p>`);$('nick').value=rec.nickname;$('save').onclick=async()=>{rec.nickname=$('nick').value.trim().slice(0,12)||'익명';localStorage.setItem('babySurvivalNick',rec.nickname);let ok=await submit(rec);if(ok){$('save').disabled=true;$('save').textContent='저장 완료'}else $('save').textContent='등록 실패 · 다시 시도'};$('again').onclick=start}
function duration(s){s=Math.floor(s);return Math.floor(s/60)+'분 '+String(s%60).padStart(2,'0')+'초'}
function rect(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function box(x,y,w,h,c,b='#55465b'){rect(x-2,y-2,w+4,h+4,b);rect(x,y,w,h,c)}
function text(t,x,y,c='#fff',size=10){cx.fillStyle=c;cx.font=`bold ${size}px monospace`;cx.fillText(t,x,y)}
function draw(){if(!g)return;const h=Number(time().slice(0,2)),sky=h>=6&&h<18?'#a2d9ed':h>=18&&h<21?'#e2a07e':h>=5&&h<6?'#8c83b2':'#313e68';rect(0,0,240,180,'#b58c78');rect(5,5,230,170,'#f3d6c1');for(let y=8;y<175;y+=15)rect(5,y,230,1,'#e8c5af');rect(5,5,230,5,'#b87e73');rect(5,170,230,5,'#a46d65');box(160,18,52,37,'#fff0d4');rect(164,22,44,29,sky);rect(185,22,2,29,'#fff0d4');rect(164,35,44,2,'#fff0d4');if(h>=21||h<6){rect(175,26,7,7,'#fff0af');rect(178,25,6,6,sky);rect(200,29,2,2,'#f9ebc5')}else{rect(174,26,10,10,'#ffe8a4')}
// nursery-only furniture
box(20,39,93,101,'#ad7664');rect(26,46,81,86,'#f9e4cb');rect(33,53,67,71,'#a8c7c7');rect(39,60,55,58,'#f6dfca');rect(19,40,6,100,'#785364');rect(108,40,6,100,'#785364');for(let x=29;x<106;x+=12){rect(x,43,4,8,'#785364');rect(x,129,4,8,'#785364')}
// baby sprite: 11x15, parent: 21x33
const bx=66,by=87;rect(bx-6,by-4,12,12,'#f1b88f');rect(bx-4,by-7,8,5,'#f1b88f');rect(bx-3,by-8,5,3,'#664958');rect(bx-4,by+8,8,7,'#8ec1ed');rect(bx-7,by+7,4,7,'#8ec1ed');rect(bx+3,by+7,4,7,'#8ec1ed');rect(bx-4,by,2,2,'#3d3545');rect(bx+2,by,2,2,'#3d3545');if(g.cry){rect(bx-2,by+5,4,3,'#b8516d');rect(bx-7,by+2,2,5,'#85c8ec');rect(bx+5,by+2,2,5,'#85c8ec')}else rect(bx-2,by+5,4,1,'#b8516d');
// caregiver
const px=156,py=113;rect(px-9,py-6,18,21,'#f9f1e4');rect(px-10,py+13,8,12,'#58688b');rect(px+2,py+13,8,12,'#58688b');rect(px-12,py-4,4,17,'#e8b08b');rect(px+8,py-4,4,17,'#e8b08b');rect(px-9,py-27,18,21,'#e8b08b');rect(px-11,py-29,22,7,'#5c4149');rect(px-10,py-24,4,12,'#5c4149');rect(px+7,py-24,4,12,'#5c4149');rect(px+3,py-35,9,10,'#5c4149');rect(px-5,py-17,3,3,'#3c3541');rect(px+3,py-17,3,3,'#3c3541');
// small toy and rug
rect(130,149,68,15,'#ead2aa');rect(134,153,60,7,'#f6e2c2');box(201,111,22,29,'#bc896f');rect(206,115,12,13,'#f6c5a1');rect(210,108,6,7,'#87a781');
if(g.cry){box(53,42,26,23,'#fff5e5','#6a5063');text('!',62,59,'#e74459',20)}else if(g.sec<g.napUntil){box(53,42,26,23,'#fff5e5','#6a5063');text('Z',61,58,'#7390cb',16)}if(g.flash&&g.sec<g.flashUntil)text(g.flash,125,44,'#d74e67',g.flash==='!'?16:12);if(night()){cx.fillStyle='rgba(35,40,88,.13)';cx.fillRect(5,5,230,170)}}
function hud(){$('clock').textContent='DAY '+day()+' · '+time();for(const [id,key] of [['e','energy'],['m','mind'],['b','baby']]){$(id+'Fill').style.width=g[key]+'%';$(id+'Num').textContent=Math.ceil(g[key]);$(id+'Row').classList.toggle('danger',g[key]<=30)}let flags=[];if(g.cry)flags.push('❗');if(g.sec<g.bellyUntil)flags.push('⚡ 배앓이');if(g.sec<g.teethUntil)flags.push('🦷 이앓이');if(g.stress>15)flags.push('🧹 집안일 스트레스 '+Math.round(g.stress));$('symbols').textContent=flags.join('  ')}
function loop(now){if(!g||!g.run){if(g)draw();return}let dt=Math.min((now-last)/1000,.07);last=now;if(!g.paused&&$('modal').classList.contains('hidden'))tick(dt);draw();hud();if(g.run)frameId=requestAnimationFrame(loop)}
cv.addEventListener('pointerdown',e=>{if(!g?.run||g.paused)return;const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*240/r.width,y=(e.clientY-r.top)*180/r.height;if(x<130&&y<150)selectCare()});$('pause').onclick=()=>{if(!g?.run)return;g.paused=!g.paused;$('pause').textContent=g.paused?'▶ 계속하기':'⏸ 일시정지';last=performance.now()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 효과음':'🔇 효과음'};$('refresh').onclick=loadRanking;
async function api(path,options={}){const r=await fetch(base+'/rest/v1/'+path,{...options,headers:{apikey:apiKey,Authorization:'Bearer '+apiKey,'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok)throw Error('HTTP '+r.status);return r.status===204?null:r.json()}
async function loadRanking(){if(!online){$('rankNote').textContent='Supabase 연결 전입니다. config.js를 설정하면 전체 랭킹이 활성화돼요.';$('rankList').replaceChildren();return}try{const rows=await api('scores?select=nickname,survived_seconds,care_count&order=survived_seconds.desc,care_count.desc&limit=10');$('rankNote').textContent='전체 플레이어 TOP 10';$('rankList').replaceChildren();for(const r of rows){const li=document.createElement('li');li.textContent=r.nickname+' · '+duration(r.survived_seconds)+' · 돌봄 '+r.care_count+'회';$('rankList').appendChild(li)}}catch{$('rankNote').textContent='랭킹 연결 오류: Supabase 설정을 확인해주세요.'}}
async function submit(rec){if(!online){$('rankNote').textContent='기기별 최고 기록이 저장됐어요.';return true}try{await api('scores',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(rec)});await loadRanking();return true}catch{return false}}
let best;try{best=JSON.parse(localStorage.getItem('babySurvivalBest')||'null')}catch{}modal(`<h2>🍼 육아 서바이벌</h2><p>아기가 울면 <b>!</b>를 터치하고<br>필요한 돌봄을 맞혀보세요.</p><p class="minor">하루 = 실제 90초 · 오답 시 정신력 -8<br>DAY 3부터 배앓이, DAY 5부터 이앓이 가능<br>보호자 상황은 랜덤 선택 이벤트로 등장</p>${best?'<p>최고 생존: '+duration(best.survived_seconds)+'</p>':''}<button id="start">GAME START</button>`);$('start').onclick=start;loadRanking();
})();
</script></body></html>
