<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>육아 서바이벌: 60초 생존</title><style>*{box-sizing:border-box}body{margin:0;background:#151b2b;color:#f7f7ff;font-family:system-ui,-apple-system,sans-serif;display:flex;justify-content:center}#wrap{width:min(100%,510px);padding:12px}h1{font-size:21px;margin:4px 0 8px}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:8px}.stat{background:#29334a;border-radius:10px;padding:8px;font-size:12px}.stat b{display:block;font-size:18px}#screen{position:relative}canvas{display:block;width:100%;aspect-ratio:4/5;border-radius:16px;background:#d7c4aa;touch-action:none}.overlay{position:absolute;inset:0;background:#111b2bdc;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:28px;gap:12px}.overlay h2{margin:0;font-size:26px}.overlay p{line-height:1.7;margin:0}.overlay button,.action{border:0;background:#f6bf60;color:#172033;border-radius:13px;padding:13px 22px;font-weight:800;font-size:16px}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;touch-action:none}.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,52px);gap:4px}.dpad button{background:#33435e;border:1px solid #56637d;border-radius:11px;color:white;font-size:22px;touch-action:none}.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}.action{height:105px;min-width:126px;touch-action:none}#message{height:40px;font-size:13px;color:#f7d999;text-align:center;padding:8px 0}small{color:#aab6cd;display:block;text-align:center;line-height:1.5}</style></head><body><main id="wrap"><h1>👶 육아 서바이벌 <span style="font-size:13px;color:#f6bf60">60초 챌린지</span></h1><div class="hud"><div class="stat">⏱ 남은 시간<b id="time">60</b></div><div class="stat">💪 보호자 체력<b id="energy">100</b></div><div class="stat">❤️ 아기 안정도<b id="baby">100</b></div></div><div id="screen"><canvas id="game" width="400" height="500"></canvas><div id="overlay" class="overlay"><h2>육아는 실전이다!</h2><p>아이방과 거실을 오가며<br>울음·기저귀·장난감 미션을 해결하세요.<br><strong>60초 동안 아기를 지켜라!</strong></p><button id="start">게임 시작 ▶</button></div></div><div id="message">미션 가까이에서 돌보기 버튼을 누르세요!</div><div class="controls"><div class="dpad"><button class="up" data-key="up">▲</button><button class="left" data-key="left">◀</button><button class="down" data-key="down">▼</button><button class="right" data-key="right">▶</button></div><button class="action" id="act">🍼 돌보기<br><span style="font-size:12px">SPACE</span></button></div><small>키보드 방향키/WASD 이동 · 스페이스 돌보기<br>휴대폰에서는 방향 버튼을 누르고 이동하세요.</small></main><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay');let running=false,last=0,remaining=60,energy=100,baby=100,score=0,spawn=0,player={x:200,y:365},tasks=[],keys=new Set(),msgUntil=0;const spots=[{x:86,y:117,room:'아이방',emoji:'🍼',name:'우는 아기',gain:22},{x:306,y:122,room:'아이방',emoji:'🧷',name:'기저귀 갈기',gain:16},{x:94,y:380,room:'거실',emoji:'🧸',name:'장난감 정리',gain:12},{x:304,y:385,room:'거실',emoji:'🥛',name:'분유 준비',gain:19}];const $=id=>document.getElementById(id);function message(s){$('message').textContent=s;msgUntil=performance.now()+2200}function reset(){running=true;remaining=60;energy=100;baby=100;score=0;spawn=0;player={x:200,y:365};tasks=[];keys.clear();overlay.style.display='none';last=performance.now();message('빨간 느낌표가 뜨는 곳으로 이동하세요!');requestAnimationFrame(loop)}function addTask(){const free=spots.filter(s=>!tasks.includes(s));if(free.length)tasks.push(free[Math.floor(Math.random()*free.length)])}function action(){if(!running)return;let near=tasks.find(t=>Math.hypot(player.x-t.x,player.y-t.y)<60);if(near){tasks=tasks.filter(t=>t!==near);baby=Math.min(100,baby+near.gain);energy=Math.max(0,energy-5);score++;message('성공! '+near.name+' 해결 (+1점)')}else if(Math.hypot(player.x-200,player.y-383)<50){energy=Math.min(100,energy+22);message('소파에서 잠깐 휴식! 체력 +22')}else message('미션 또는 소파에 더 가까이 가세요!')}function finish(win){running=false;overlay.style.display='flex';overlay.innerHTML='<h2>'+(win?'🎉 생존 성공!':'💀 육아 실패!')+'</h2><p>해결한 미션: <strong>'+score+'개</strong><br>'+(win?'오늘도 무사히 버텼어요!':'아기 안정도나 체력이 0이 되었어요.')+'</p><button id="again">다시 도전 ▶</button>';$('again').onclick=reset}function rounded(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function draw(){ctx.clearRect(0,0,400,500);rounded(12,12,376,214,16,'#f4dcbf');rounded(12,274,376,214,16,'#e8cba9');rounded(12,236,376,28,4,'#a5b3b4');rounded(166,226,68,49,2,'#ead7b7');ctx.fillStyle='#564c4b';ctx.font='bold 18px system-ui';ctx.fillText('아이방',27,42);ctx.fillText('거실',27,303);rounded(35,66,112,112,14,'#f2b9b8');rounded(48,78,86,88,10,'#fff0e1');ctx.font='48px serif';ctx.fillText('👶',66,143);rounded(265,67,92,88,12,'#f7e8a9');ctx.font='46px serif';ctx.fillText('🧷',286,130);rounded(36,335,120,93,15,'#9db6a2');ctx.font='46px serif';ctx.fillText('🧸',72,398);rounded(270,334,96,98,12,'#d6a884');ctx.font='46px serif';ctx.fillText('🍼',292,394);rounded(167,350,66,62,12,'#92abc2');ctx.font='25px serif';ctx.fillText('🛋️',177,391);ctx.font='11px system-ui';ctx.fillStyle='#243548';ctx.fillText('휴식 +22',178,423);for(let t of tasks){ctx.beginPath();ctx.arc(t.x,t.y,35,0,Math.PI*2);ctx.strokeStyle='#f04756';ctx.lineWidth=5;ctx.stroke();rounded(t.x-15,t.y-58,30,28,9,'#f04756');ctx.font='bold 21px system-ui';ctx.fillStyle='white';ctx.fillText('!',t.x-4,t.y-37)}ctx.beginPath();ctx.arc(player.x,player.y,19,0,Math.PI*2);ctx.fillStyle='#4879bd';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.font='26px serif';ctx.fillText('🧑',player.x-15,player.y+9);ctx.font='bold 12px system-ui';ctx.fillStyle='#243548';ctx.fillText('나',player.x-4,player.y-26);ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';rounded(250,15,123,28,10,'#34445b');ctx.fillStyle='white';ctx.fillText('해결 '+score+'개',276,34)}function loop(now){if(!running)return;let dt=Math.min((now-last)/1000,.05);last=now;remaining-=dt;spawn+=dt;const vx=(keys.has('right')?1:0)-(keys.has('left')?1:0),vy=(keys.has('down')?1:0)-(keys.has('up')?1:0),norm=Math.hypot(vx,vy)||1;let nx=Math.max(30,Math.min(370,player.x+vx/norm*175*dt)),ny=Math.max(29,Math.min(470,player.y+vy/norm*175*dt));if(ny>226&&ny<274&&(nx<163||nx>237)){ny=player.y<250?226:274}player.x=nx;player.y=ny;if(spawn>3.3){spawn=0;addTask()}baby=Math.max(0,baby-dt*(tasks.length*.95+.2));energy=Math.max(0,energy-dt*.24);$('time').textContent=Math.ceil(remaining);$('energy').textContent=Math.ceil(energy);$('baby').textContent=Math.ceil(baby);draw();if(baby<=0||energy<=0)return finish(false);if(remaining<=0)return finish(true);requestAnimationFrame(loop)}$('start').onclick=reset;$('act').onclick=action;const keymap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};document.addEventListener('keydown',e=>{if(keymap[e.key]){keys.add(keymap[e.key]);e.preventDefault()}if(e.code==='Space'){e.preventDefault();if(!e.repeat)action()}});document.addEventListener('keyup',e=>{if(keymap[e.key])keys.delete(keymap[e.key])});document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k);b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k))});draw();
</script></body></html>
