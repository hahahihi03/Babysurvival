<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#222a40"><title>육아 서바이벌</title><style>
*{box-sizing:border-box}body{margin:0;background:#161c2c;color:#f6f2df;font-family:system-ui,'Apple SD Gothic Neo',sans-serif}main{max-width:760px;margin:auto;padding:12px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:20px;margin:6px 0}.pill{background:#343d59;padding:7px 10px;border-radius:8px;font-size:13px}#meters{display:grid;gap:7px;margin:10px 0}.meter{display:grid;grid-template-columns:90px 1fr 35px;align-items:center;gap:8px;font-size:12px}.track{height:14px;border:2px solid #101725;background:#51526a}.fill{height:100%;width:100%;background:#74d0a1}.meter:nth-child(2) .fill{background:#83b5ef}.meter:nth-child(3) .fill{background:#f2c875}.danger .fill{background:#f27070;animation:blink .6s infinite alternate}@keyframes blink{to{opacity:.4}}canvas{width:100%;aspect-ratio:320/208;display:block;image-rendering:pixelated;touch-action:none;border:4px solid #4d5674;border-radius:4px;background:#393b56}#status{min-height:38px;margin:10px 0;color:#f7df9d;font-size:14px}#actions{display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit}button{background:#f1c873;border:0;color:#282b3a;font-weight:800;padding:11px 14px;border-radius:8px;cursor:pointer}button.secondary{background:#414d6b;color:white}button:disabled{opacity:.5}#events{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0;min-height:28px}.chip{background:#44445b;border:1px solid #a8a0a2;padding:4px 8px;border-radius:5px;font-size:12px}#overlay{position:fixed;inset:0;background:#111827dc;display:flex;align-items:center;justify-content:center;z-index:5;padding:18px}#overlay.hidden{display:none}.panel{background:#2d3852;border:3px solid #f0cb7d;max-width:420px;width:100%;padding:22px;text-align:center;box-shadow:7px 7px #111}.panel h2{font-size:28px;margin:8px 0}.panel p{line-height:1.6}.panel input{width:100%;padding:10px;border:2px solid #7582a2;border-radius:6px;background:#151d30;color:white;margin:8px 0}.panel button{margin:5px}.small{font-size:12px;color:#c2cad8}#rankings{margin-top:15px;padding:12px;background:#242d43;border-radius:8px}#rankings h2{font-size:16px;margin:0 0 8px}#rankList{padding-left:24px;font-size:13px;line-height:1.9}#help{font-size:12px;color:#bec7d7;line-height:1.7}#chooser{display:none;position:fixed;inset:0;z-index:4;background:#101724b8;align-items:center;justify-content:center;padding:20px}#chooser .panel{max-width:310px}footer{color:#9ba6bc;font-size:11px;margin:18px 0}
</style></head><body><main><header><h1>🍼 육아 서바이벌</h1><div class="pill" id="clock">DAY 1 · 07:00</div></header><section id="meters"><div class="meter" id="mEnergy"><span>보호자 체력</span><div class="track"><div class="fill" id="energyFill"></div></div><b id="energyVal">100</b></div><div class="meter" id="mMind"><span>보호자 정신력</span><div class="track"><div class="fill" id="mindFill"></div></div><b id="mindVal">100</b></div><div class="meter" id="mBaby"><span>아기 안정도</span><div class="track"><div class="fill" id="babyFill"></div></div><b id="babyVal">100</b></div></section><canvas id="game" width="320" height="208" aria-label="육아 서바이벌 게임 화면"></canvas><div id="status">가구를 터치해 이동하고 행동하세요.</div><div id="events"></div><div id="actions"><button class="secondary" id="pauseBtn">일시정지</button><button class="secondary" id="muteBtn">효과음 켜기</button><button class="secondary" id="rankBtn">랭킹 새로고침</button></div><p id="help">왼쪽은 아기방, 오른쪽은 거실이에요. 아기침대=돌봄, 냉장고=분유 준비, 소파=휴식, 식탁=식사. 바닥을 터치하면 이동하고 진행 중인 행동은 취소돼요. 휴식과 식사는 중단해도 회복량이 유지돼요.</p><section id="rankings"><h2>🏆 전체 플레이어 랭킹</h2><div id="rankNote" class="small">온라인 랭킹 연결 상태 확인 중…</div><ol id="rankList"></ol></section><footer>1일 = 실제 3분 · 게임은 브라우저에서 실행됩니다.</footer></main><div id="chooser"><div class="panel"><h2>어떤 돌봄을 할까요?</h2><div id="choices"></div><button class="secondary" id="cancelChoice">취소</button></div></div><div id="overlay"><div class="panel" id="panelContent"></div></div><script src="config.js"></script><script>
(()=>{'use strict';
const C=document.getElementById('game'),ctx=C.getContext('2d');ctx.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));const rand=(a,b)=>a+Math.random()*(b-a);
const EVENTS={hunger:{name:'배고픔',icon:'🍼',drain:1,boost:30,cost:12,mind:3,duration:8},diaper:{name:'기저귀',icon:'🧷',drain:.7,boost:20,cost:8,mind:-3,duration:5},sleep:{name:'졸림',icon:'🌙',drain:.8,boost:25,cost:6,mind:5,duration:7},cry:{name:'원인 모를 울음',icon:'💧',drain:1.2,boost:15,cost:10,mind:-8,duration:4}};
const objects={crib:{x:24,y:53,w:79,h:65,stand:[111,108]},fridge:{x:268,y:43,w:32,h:52,stand:[250,104]},sofa:{x:185,y:44,w:68,h:36,stand:[218,99]},table:{x:192,y:124,w:62,h:37,stand:[222,174]}};
let g=null,raf=0,last=0,sound=false,audio=null,notice='';let noticeUntil=0;let leaderboardEnabled=false;
const cfg=window.BABY_SURVIVAL_CONFIG||{};const url=(cfg.supabaseUrl||'').replace(/\/$/,'');const key=cfg.supabaseAnonKey||'';leaderboardEnabled=Boolean(url&&key);
function msg(s,t=3){notice=s;noticeUntil=performance.now()+t*1000;$('status').textContent=s}
function reset(){g={running:true,paused:false,seconds:0,energy:100,mind:100,baby:100,x:219,y:110,target:null,activity:null,events:[],nextEvent:rand(19,25),crySeconds:0,cryGrace:0,mealReady:0,mealUsed:0,formula:false,careCount:0,specialReady:60,specialNext:rand(68,90),effects:[],lastTick:0,day:1};last=performance.now();$('pauseBtn').textContent='일시정지';$('overlay').classList.add('hidden');msg('DAY 1 시작! 아기를 돌보며 오래 살아남으세요.',4);updateHud();cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}
function day(){return Math.floor(g.seconds/180)+1}function hour(){return (7+g.seconds/180*24)%24}function timeString(){let mins=Math.floor((7*60+g.seconds*8)%1440);return String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0')}function night(){let h=hour();return h>=21||h<6}function recoveryFactor(){return night()?.8:1}function stage(){let d=day();return d<=2?[25,35]:d<=5?[18,28]:d<=10?[13,22]:[10,18]}
function pickEvent(){if(g.events.length>=(day()<=2?1:2))return;let pool=Object.keys(EVENTS).filter(k=>!g.events.some(e=>e.type===k));if(!pool.length)return;let type=pool[Math.floor(Math.random()*pool.length)];g.events.push({type,age:0,started:false,disaster:false});if(type==='cry')g.events[g.events.length-1].started=true;msg(EVENTS[type].icon+' '+EVENTS[type].name+' 돌봄이 필요해요!');beep(360,.09)}
function crying(){return g.cryGrace<=0&&g.events.some(e=>e.started)}
function cryRate(t){return t<10?.2:t<20?.4:t<30?.7:1}
function stopAction(){if(g.activity){if(g.activity.kind==='care'||g.activity.kind==='prep')msg('행동 중단! 진행도가 초기화됐어요.',1.5);g.activity=null}}
function walkTo(x,y,object){stopAction();g.target={x:clamp(x,12,307),y:clamp(y,29,194),object};}
function interact(name){if(!g||!g.running||g.paused)return;let o=objects[name];walkTo(...o.stand,name)}
function arrival(name){if(name==='crib'){if(!g.events.length){msg('아기가 편안하게 쉬고 있어요.');return}if(g.events.length>1){showChoices();return}startCare(g.events[0].type)}else if(name==='fridge'){if(g.formula){msg('이미 분유를 준비했어요. 아기침대로 가세요.');return}g.activity={kind:'prep',elapsed:0,duration:3};msg('분유 준비 중…')}else if(name==='sofa'){g.activity={kind:'sofa',elapsed:0};msg('소파에서 휴식 중…')}else if(name==='table'){if(g.seconds<g.mealReady){msg('식사까지 '+Math.ceil(g.mealReady-g.seconds)+'초 남았어요.');return}g.mealReady=g.seconds+60;g.activity={kind:'meal',elapsed:0,duration:5};msg('식사 중… (재사용 대기 60초 시작)')}}
function showChoices(){let ch=$('choices');ch.innerHTML='';g.events.forEach(e=>{let b=document.createElement('button');b.textContent=EVENTS[e.type].icon+' '+EVENTS[e.type].name;b.onclick=()=>{$('chooser').style.display='none';startCare(e.type)};ch.appendChild(b)});$('chooser').style.display='flex'}
function startCare(type){if(type==='hunger'&&!g.formula){msg('먼저 냉장고에서 분유를 준비하세요!');return}let e=g.events.find(e=>e.type===type);if(!e)return;g.activity={kind:'care',type,elapsed:0,duration:EVENTS[type].duration*(e.disaster?2:1)*(g.mind<=30?1.2:1)};msg(EVENTS[type].icon+' '+EVENTS[type].name+' 돌봄 중…')}
function careDone(type){let e=EVENTS[type];g.baby=clamp(g.baby+e.boost);g.energy=clamp(g.energy-e.cost);g.mind=clamp(g.mind+e.mind);g.events=g.events.filter(v=>v.type!==type);g.careCount++;if(type==='hunger')g.formula=false;if(g.events.length){g.events.forEach(v=>{if(v.age>=10)v.started=true})}else{g.crySeconds=0}if(!g.events.some(v=>v.started)){g.crySeconds=0}else if(!g.events.length){g.crySeconds=0}g.activity=null;msg('돌봄 완료! 아기 안정도 +'+e.boost);beep(640,.13)}
function special(){if(day()<3||g.seconds<g.specialReady)return;let kinds=['disaster','spill','panic'],k=kinds[Math.floor(Math.random()*kinds.length)];if(k==='disaster'){let d=g.events.find(e=>e.type==='diaper'&&!e.disaster);if(d){d.disaster=true;msg('💩 기저귀 대참사! 교체 시간이 2배!')}else return}else if(k==='spill'){if(g.formula){g.formula=false;if(g.activity?.type==='hunger')g.activity=null;msg('🍼 분유를 쏟았어요! 다시 준비하세요.')}else return}else{g.effects.push({type:'panic',until:g.seconds+5});msg('😵‍💫 보호자 멘붕! 5초간 이동 속도 감소.')}g.specialReady=g.seconds+60;beep(190,.2)}
function tick(dt){g.seconds+=dt;let newDay=day();if(newDay!==g.day){g.day=newDay;msg('🌅 DAY '+newDay+' 생존!');beep(730,.15)}if(g.seconds>=g.nextEvent){pickEvent();let [a,b]=stage();g.nextEvent=g.seconds+rand(a,b)}if(day()>=3&&g.seconds>=g.specialNext){special();g.specialNext=g.seconds+rand(25,43)}
let moving=!!g.target;if(moving){let t=g.target,dx=t.x-g.x,dy=t.y-g.y,dist=Math.hypot(dx,dy);let panic=g.effects.some(e=>e.type==='panic'&&e.until>g.seconds);let speed=75*(g.energy<=30?.8:1)*(panic?.7:1);if(dist<=speed*dt){g.x=t.x;g.y=t.y;g.target=null;if(t.object)arrival(t.object)}else{g.x+=dx/dist*speed*dt;g.y+=dy/dist*speed*dt}}
let a=g.activity;if(a){a.elapsed+=dt;if(a.kind==='sofa'){g.energy=clamp(g.energy+2.5*recoveryFactor()*dt);g.mind=clamp(g.mind+recoveryFactor()*dt)}else if(a.kind==='meal'){g.energy=clamp(g.energy+3*recoveryFactor()*dt);g.mind=clamp(g.mind+recoveryFactor()*dt);if(a.elapsed>=5){g.activity=null;msg('식사 완료!')}}else if(a.elapsed>=a.duration){if(a.kind==='prep'){g.formula=true;g.activity=null;msg('분유 준비 완료! 아기침대로 가세요.')}else if(a.kind==='care')careDone(a.type)}}
for(let e of g.events){e.age+=dt;if(e.type!=='cry'&&e.age>=10)e.started=true}g.cryGrace=Math.max(0,g.cryGrace-dt);let active=crying();if(active){g.crySeconds+=dt;g.mind-=cryRate(g.crySeconds)*dt}else if(!g.events.some(e=>e.started)){g.crySeconds=0}
let drain=.1;for(let e of g.events){if(g.activity?.kind==='care'&&g.activity.type===e.type)continue;drain+=EVENTS[e.type].drain}g.baby-=drain*dt;g.energy-=.1*dt;g.mind-=.1*dt;g.energy=clamp(g.energy);g.mind=clamp(g.mind);g.baby=clamp(g.baby);if(!g.energy||!g.mind||!g.baby)endGame();}
function endGame(){if(!g.running)return;g.running=false;let why=!g.energy?'보호자 체력 고갈':!g.mind?'보호자 정신력 고갈':'아기 안정도 고갈';let record={nickname:localStorage.getItem('babySurvivalNick')||'익명',survived_seconds:Math.floor(g.seconds),care_count:g.careCount};let best=JSON.parse(localStorage.getItem('babySurvivalBest')||'null');if(!best||record.survived_seconds>best.survived_seconds)localStorage.setItem('babySurvivalBest',JSON.stringify(record));let html=`<h2>GAME OVER</h2><p>${why}</p><p><strong>DAY ${day()} · ${timeString()}</strong><br>실제 생존 ${formatDuration(g.seconds)}<br>돌봄 성공 ${g.careCount}회</p><input id="nickname" maxlength="12" placeholder="랭킹 닉네임 (최대 12자)" value="${escapeHtml(localStorage.getItem('babySurvivalNick')||'')}"/><div><button id="saveScore">${leaderboardEnabled?'온라인 랭킹 등록':'내 기록 저장'}</button><button id="restart">다시 도전</button></div><p class="small">${leaderboardEnabled?'닉네임을 입력해 랭킹에 기록을 남겨보세요.':'온라인 랭킹은 config.js 연결 후 사용할 수 있어요.'}</p>`;showOverlay(html);$('saveScore').onclick=async()=>{let nick=$('nickname').value.trim().slice(0,12)||'익명';localStorage.setItem('babySurvivalNick',nick);record.nickname=nick;await submitScore(record);$('saveScore').disabled=true;$('saveScore').textContent='기록 저장됨'};$('restart').onclick=reset}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function formatDuration(s){let n=Math.floor(s);return Math.floor(n/60)+'분 '+String(n%60).padStart(2,'0')+'초'}
function showOverlay(html){$('panelContent').innerHTML=html;$('overlay').classList.remove('hidden')}
function updateHud(){if(!g)return;$('clock').textContent='DAY '+day()+' · '+timeString();for(let [k,id] of [['energy','Energy'],['mind','Mind'],['baby','Baby']]){$(k+'Fill').style.width=g[k]+'%';$(k+'Val').textContent=Math.ceil(g[k]);$('m'+id).classList.toggle('danger',g[k]<=30)}let e=$('events');e.innerHTML='';g.events.forEach(v=>{let s=document.createElement('span');s.className='chip';s.textContent=EVENTS[v.type].icon+' '+EVENTS[v.type].name+(v.started?' · 울음':'');e.appendChild(s)});if(g.formula){let s=document.createElement('span');s.className='chip';s.textContent='🍼 분유 준비됨';e.appendChild(s)}if(g.activity){let a=g.activity,label=a.kind==='care'?EVENTS[a.type].name:a.kind==='prep'?'분유 준비':a.kind==='sofa'?'휴식':'식사';$('status').textContent=label+' '+(a.duration?Math.floor(clamp(a.elapsed/a.duration,0,1)*100)+'%':'중 (터치하면 중단)')}else if(performance.now()>noticeUntil){$('status').textContent=crying()?'아기가 울고 있어요! 정신력이 감소합니다.':'가구를 터치해 이동하고 행동하세요.'}}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function outline(x,y,w,h,fill,border='#22253d'){rect(x-2,y-2,w+4,h+4,border);rect(x,y,w,h,fill)}function pixelText(t,x,y,color='#fff',size=8){ctx.fillStyle=color;ctx.font='bold '+size+'px monospace';ctx.fillText(t,x,y)}
function draw(){rect(0,0,320,208,'#24283e');let h=hour(),sky=h>=6&&h<18?'#9ed9ef':h>=18&&h<21?'#d98b79':h>=5&&h<6?'#867aa8':'#2c365c';rect(5,22,151,178,'#c7b4a0');rect(161,22,154,178,'#b8bdac');for(let y=24;y<200;y+=16){rect(5,y,151,1,'#b6a18f');rect(161,y,154,1,'#a5aa9c')}rect(154,22,7,83,'#55536a');rect(154,136,7,64,'#55536a');rect(154,105,7,31,'#c7a16b');rect(5,22,310,4,'#58566c');rect(5,198,310,4,'#58566c');pixelText('아기방',10,15,'#f4e4c2');pixelText('거실',171,15,'#f4e4c2');outline(106,34,34,27,'#f7e7c8');rect(109,37,28,21,sky);rect(122,37,2,21,'#f7e7c8');rect(109,47,28,2,'#f7e7c8');if(h>=21||h<6){rect(114,40,5,5,'#f6e5a4');rect(116,39,4,4,sky);rect(132,44,2,2,'#e7e7d5')}else{rect(114,40,7,7,'#fff2b0')}outline(24,53,79,65,'#ae745f');rect(30,58,67,54,'#f2d8a2');rect(36,62,55,44,'#a6c7c2');rect(43,65,42,36,'#f6dfc6');rect(55,68,20,17,'#e7b48e');rect(54,85,23,16,'#f4c879');rect(59,73,3,3,'#3c3340');rect(68,73,3,3,'#3c3340');rect(63,80,5,2,'#ba6f6b');rect(31,54,3,62,'#6f4b55');rect(93,54,3,62,'#6f4b55');outline(268,43,32,52,'#d9e7d8');rect(268,65,32,2,'#98a9ae');rect(292,53,3,9,'#879ca3');rect(292,72,3,9,'#879ca3');outline(185,44,68,36,'#8c8eb2');rect(191,49,25,20,'#aaa8c5');rect(220,49,25,20,'#aaa8c5');rect(185,72,68,8,'#646e9a');outline(192,124,62,37,'#ad8064');rect(197,129,52,27,'#c59a74');rect(202,135,14,8,'#eee1c0');rect(226,133,11,11,'#e4d9c4');rect(230,137,4,4,'#bd8a68');rect(197,159,8,13,'#765b58');rect(242,159,8,13,'#765b58');rect(g.x-5,g.y-15,11,12,'#6a759a');rect(g.x-6,g.y-4,4,6,'#343b57');rect(g.x+2,g.y-4,4,6,'#343b57');rect(g.x-5,g.y-23,11,10,'#e8b68d');rect(g.x-5,g.y-24,11,4,'#473b45');rect(g.x-3,g.y-19,2,2,'#302b3a');rect(g.x+2,g.y-19,2,2,'#302b3a');if(g.formula){rect(g.x+7,g.y-12,4,8,'#f6e6cf');rect(g.x+8,g.y-14,2,2,'#e9b0a6')}if(g.events.length){for(let i=0;i<g.events.length;i++){let e=g.events[i];rect(40+i*27,38,24,12,'#f8ebc6');pixelText(EVENTS[e.type].icon,43+i*27,47,'#3a3340',9)}}if(crying()){pixelText('!!',77,64,'#e65068',12)}if(g.activity){let a=g.activity,p=a.duration?clamp(a.elapsed/a.duration,0,1):1;rect(g.x-12,g.y-32,25,5,'#343248');rect(g.x-11,g.y-31,23*p,3,'#7fdaa4')}if(g.target){rect(g.target.x-3,g.target.y-1,7,2,'#f8df87');rect(g.target.x-1,g.target.y-3,2,7,'#f8df87')}if(night()) {ctx.fillStyle='rgba(23,28,64,.17)';ctx.fillRect(0,22,320,180)}}
function frame(now){if(!g||!g.running){draw();return}let dt=Math.min((now-last)/1000,.08);last=now;if(!g.paused)tick(dt);draw();updateHud();if(g.running)raf=requestAnimationFrame(frame)}
function touch(ev){if(!g?.running||g.paused||$('chooser').style.display==='flex')return;let r=C.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*320,y=(ev.clientY-r.top)/r.height*208;for(let name of ['crib','fridge','sofa','table']){let o=objects[name];if(x>=o.x-5&&x<=o.x+o.w+5&&y>=o.y-5&&y<=o.y+o.h+5){interact(name);return}}walkTo(x,y,null)}C.addEventListener('pointerdown',touch);$('cancelChoice').onclick=()=>{$('chooser').style.display='none'};$('pauseBtn').onclick=()=>{if(!g?.running)return;g.paused=!g.paused;$('pauseBtn').textContent=g.paused?'계속하기':'일시정지';last=performance.now();msg(g.paused?'일시정지':'다시 시작!')};$('muteBtn').onclick=()=>{sound=!sound;$('muteBtn').textContent=sound?'효과음 끄기':'효과음 켜기'};$('rankBtn').onclick=loadRankings;
function beep(f,d){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),v=audio.createGain();o.type='square';o.frequency.value=f;v.gain.value=.025;o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}
async function api(path,opts={}){let res=await fetch(url+'/rest/v1/'+path,{...opts,headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json',...(opts.headers||{})}});if(!res.ok)throw Error('서버 응답 '+res.status);return res.status===204?null:res.json()}
async function loadRankings(){if(!leaderboardEnabled){$('rankNote').textContent='온라인 랭킹을 사용하려면 config.js에 Supabase 연결 정보를 입력하세요.';$('rankList').innerHTML='';return}try{let rows=await api('scores?select=nickname,survived_seconds,care_count&order=survived_seconds.desc,care_count.desc&limit=10');$('rankNote').textContent='전체 플레이어 상위 10명';$('rankList').innerHTML='';rows.forEach(r=>{let li=document.createElement('li');li.textContent=r.nickname+' — '+formatDuration(r.survived_seconds)+' · 돌봄 '+r.care_count+'회';$('rankList').appendChild(li)})}catch(e){$('rankNote').textContent='랭킹을 불러올 수 없어요. 연결 설정과 데이터베이스 정책을 확인하세요.'}}
async function submitScore(record){if(!leaderboardEnabled){$('rankNote').textContent='내 최고 기록은 이 기기에 저장됐어요. 온라인 연결 전에는 공유 랭킹에 올라가지 않아요.';return}try{await api('scores',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(record)});$('rankNote').textContent='랭킹 등록 완료!';await loadRankings()}catch(e){$('rankNote').textContent='랭킹 등록 실패: 연결 설정 또는 정책을 확인하세요.';msg('온라인 랭킹 등록에 실패했어요. 내 최고 기록은 기기에 남아 있어요.',5)}}
let best=JSON.parse(localStorage.getItem('babySurvivalBest')||'null');showOverlay(`<h2>🍼 육아 서바이벌</h2><p>보호자 체력 · 정신력 · 아기 안정도를 관리하며<br><strong>최대한 오래 살아남으세요!</strong></p><p class="small">1 DAY = 실제 3분<br>화면 터치로 이동 · 가구 터치로 행동<br>이벤트는 최대 2개까지 겹칩니다.</p>${best?'<p>내 최고 기록: '+formatDuration(best.survived_seconds)+'</p>':''}<button id="startBtn">GAME START</button>`);$('startBtn').onclick=reset;loadRankings();
})();
</script></body></html>
